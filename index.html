<!doctype html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>高校数学シミュレーション</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header class="hero">
    <div>
      <p class="eyebrow">高校数学を、見て理解する</p>
      <h1>関数シミュレーション</h1>
      <p class="subtitle">パラメータを動かして、グラフの変化を確認しましょう。</p>
    </div>
  </header>

  <main>
    <nav class="tabs" aria-label="シミュレーションの切り替え">
      <button class="tab active" data-tab="quadratic">二次関数</button>
      <button class="tab" data-tab="trigonometric">三角関数</button>
    </nav>

    <section id="quadratic" class="panel active">
      <div class="controls">
        <h2>二次関数 y = ax² + bx + c</h2>
        <label>a（<span id="aValue">1</span>）
          <input id="a" type="range" min="-3" max="3" step="0.1" value="1">
        </label>
        <label>b（<span id="bValue">0</span>）
          <input id="b" type="range" min="-5" max="5" step="0.1" value="0">
        </label>
        <label>c（<span id="cValue">0</span>）
          <input id="c" type="range" min="-5" max="5" step="0.1" value="0">
        </label>
        <button id="quadraticReset" class="reset">リセット</button>
      </div>

      <div class="visual">
        <canvas id="quadraticCanvas" aria-label="二次関数のグラフ"></canvas>
        <div class="formula">
          <p id="quadraticFormula">y = x²</p>
          <p id="quadraticVertex"></p>
          <p id="quadraticAxis"></p>
          <p id="quadraticDiscriminant"></p>
        </div>
      </div>
    </section>

    <section id="trigonometric" class="panel">
      <div class="controls">
        <h2>三角関数 y = a sin(bx + c) + d</h2>
        <label>振幅 a（<span id="ampValue">1</span>）
          <input id="amp" type="range" min="-3" max="3" step="0.1" value="1">
        </label>
        <label>角周波数 b（<span id="freqValue">1</span>）
          <input id="freq" type="range" min="0.2" max="3" step="0.1" value="1">
        </label>
        <label>位相 c（<span id="phaseValue">0</span>）
          <input id="phase" type="range" min="-6.28" max="6.28" step="0.05" value="0">
        </label>
        <label>上下移動 d（<span id="shiftValue">0</span>）
          <input id="shift" type="range" min="-3" max="3" step="0.1" value="0">
        </label>
        <button id="trigReset" class="reset">リセット</button>
      </div>

      <div class="visual">
        <canvas id="trigCanvas" aria-label="三角関数のグラフ"></canvas>
        <div class="formula">
          <p id="trigFormula">y = sin x</p>
          <p id="trigPeriod"></p>
          <p id="trigPhase"></p>
        </div>
      </div>
    </section>
  </main>

  <script src="script.js"></script>
</body>
</html>
